<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сфера — студия аватаров</title>
<meta name="author" content="fatumurfate">
<meta name="description" content="Редактор стеклянных 3D-аватаров: форма, материал, лицо, косметика, свет и экспорт в PNG.">
<style>:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --r-lg: 12px; --r-md: 10px; --r-sm: 8px;
  --c1: #1f6fff; --c2: #3a3a46; --c3: #6a8cff;
}
:root, [data-theme="dark"]{
  --bg: #0b0c10;
  --text: #ffffff;
  --text-2: rgba(255,255,255,.66);
  --text-3: rgba(255,255,255,.45);
  --glass: rgba(22,24,30,.46);
  --glass-2: rgba(255,255,255,.06);
  --glass-3: rgba(255,255,255,.1);
  --border: rgba(255,255,255,.11);
  --border-2: rgba(255,255,255,.2);
  --hi: rgba(255,255,255,.12);
  --accent: #5E9FE8;
  --accent-ink: #0b1626;
  --track: rgba(255,255,255,.14);
  --shadow: 0 1px 2px rgba(0,0,0,.25), 0 18px 48px rgba(0,0,0,.35);
  --blob-op: .5;
  color-scheme: dark;
}
[data-theme="light"]{
  --bg: #e9eaef;
  --text: #1d1d1f;
  --text-2: #5f5d59;
  --text-3: #7d7a75;
  --glass: rgba(255,255,255,.52);
  --glass-2: rgba(255,255,255,.55);
  --glass-3: rgba(255,255,255,.85);
  --border: rgba(20,20,30,.08);
  --border-2: rgba(20,20,30,.16);
  --hi: rgba(255,255,255,.9);
  --accent: #2783DE;
  --accent-ink: #ffffff;
  --track: rgba(20,20,30,.12);
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 18px 48px rgba(40,40,60,.12);
  --blob-op: .55;
  color-scheme: light;
}
*{ box-sizing: border-box; }
html,body{ margin:0; height:100%; }
body{
  font: 15px/1.5 var(--font);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  transition: background .4s ease;
}
button, input{ font: inherit; color: inherit; }
button{ cursor: pointer; }
:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

/* ambient */
.ambient{ position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.blob{ position: absolute; border-radius: 50%; opacity: var(--blob-op); }
.b1{ width: 80vw; height: 80vw; left: -28vw; top: -34vw; background: radial-gradient(closest-side, var(--c1), transparent); }
.b2{ width: 72vw; height: 72vw; right: -28vw; bottom: -34vw; background: radial-gradient(closest-side, var(--c2), transparent); }
.b3{ width: 50vw; height: 50vw; left: 28vw; top: 18vh; background: radial-gradient(closest-side, var(--c3), transparent); opacity: calc(var(--blob-op) * .55); }


/* glass */
.glass{
  position: relative;
  background: var(--glass);
  border: 1px solid var(--border);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  backdrop-filter: blur(18px) saturate(140%);
  box-shadow: var(--shadow), inset 0 1px 0 var(--hi);
  border-radius: var(--r-lg);
}

.app{ position: relative; z-index: 1; height: 100dvh; display: grid; grid-template-rows: auto 1fr; gap: 16px; padding: 16px; }

/* top bar */
.topbar{ display:flex; align-items:center; justify-content:space-between; padding: 8px 8px 8px 16px; min-height: 60px; }
.brand{ display:flex; align-items:center; gap:12px; }
.brand svg{ width: 30px; height: 30px; flex: none; }
.brand b{ display:block; font-size: 17px; font-weight: 650; letter-spacing: -.01em; line-height: 1.2; }
.brand span{ display:block; font-size: 14px; color: var(--text-2); line-height: 1.2; }
.brand em{ font-style: normal; }
.brand .author{ color: var(--text); font-weight: 600; }
.top-actions{ display:flex; align-items:center; gap: 8px; }

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap: 8px;
  min-height: 44px; padding: 0 16px; border-radius: var(--r-md);
  border: 1px solid var(--border); background: var(--glass-2);
  font-weight: 560; font-size: 15px; white-space: nowrap;
  transition: background .2s, border-color .2s, transform .12s;
}
.btn:hover{ background: var(--glass-3); border-color: var(--border-2); }
.btn:active{ transform: scale(.98); }
.btn svg{ width: 18px; height: 18px; flex:none; }
.btn.primary{ background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.btn.primary:hover{ filter: brightness(1.08); background: var(--accent); }
.btn.block{ width: 100%; }
.icon-btn{ width: 44px; height: 44px; padding: 0; display:inline-flex; align-items:center; justify-content:center;
  border-radius: var(--r-md); border: 1px solid transparent; background: transparent; color: var(--text-2); transition: background .2s, color .2s; }
.icon-btn:hover{ background: var(--glass-2); color: var(--text); border-color: var(--border); }
.icon-btn[aria-pressed="true"]{ color: var(--text); background: var(--glass-3); border-color: var(--border-2); }
.icon-btn:disabled{ opacity: .35; pointer-events: none; }
.icon-btn svg{ width: 20px; height: 20px; }

/* layout */
.layout{ min-height: 0; display: grid; grid-template-columns: minmax(0,1fr) 452px; gap: 16px; }

.stage{ min-height: 0; display:flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; gap: 16px; overflow: hidden; }
.canvas-wrap{
  position: relative; aspect-ratio: 1; width: min(100%, calc(100dvh - 252px)); max-width: 860px;
  border-radius: var(--r-lg); overflow: hidden;
  box-shadow: 0 0 0 1px var(--border), 0 30px 80px rgba(0,0,0,.35);
  transition: border-radius .45s cubic-bezier(.2,.8,.2,1);
  touch-action: none; cursor: grab;
  background: #000;
}
.canvas-wrap.dragging{ cursor: grabbing; }
.canvas-wrap.round{ border-radius: 50%; }
.canvas-wrap canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
.hint{
  position:absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
  padding: 6px 12px; border-radius: var(--r-sm); font-size: 14px; white-space: nowrap;
  color: rgba(255,255,255,.9); background: rgba(10,10,14,.55); border: 1px solid rgba(255,255,255,.14);
  opacity: 0; transition: opacity .35s; pointer-events: none;
}
.canvas-wrap:hover .hint{ opacity: 1; }
.canvas-wrap.round .hint{ bottom: 22%; }
.loader{ position:absolute; inset:0; display:flex; flex-direction:column; gap: 12px; align-items:center; justify-content:center; color: rgba(255,255,255,.85); font-size: 14px; background: rgba(0,0,0,.25); }
.loader[hidden]{ display:none; }
.loader .spin{ width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.25); border-top-color: #fff; animation: spin .8s linear infinite; }
@keyframes spin{ to{ transform: rotate(360deg); } }
.fallback{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-align:center; padding: 32px; color: #fff; font-size: 15px; }

.stage-bar{ display:flex; align-items:center; justify-content: space-between; gap: 16px; width: min(100%, calc(100dvh - 252px)); max-width: 860px; }
.tools{ display:flex; align-items:center; gap: 2px; padding: 4px; border-radius: var(--r-md); background: var(--glass-2); border: 1px solid var(--border); }
.tools .sep{ width:1px; height: 24px; background: var(--border-2); margin: 0 6px; }
.minis{ display:flex; align-items:center; gap: 12px; }
.minis span{ font-size: 14px; color: var(--text-2); margin-right: 4px; }
.mini{ border-radius: 50%; box-shadow: 0 0 0 1px var(--border-2); display:block; }

/* inspector */
.inspector{ min-height: 0; display:grid; grid-template-columns: 84px minmax(0,1fr); overflow: hidden; }
.rail{ display:flex; flex-direction: column; gap: 4px; padding: 12px 8px; border-right: 1px solid var(--border); overflow-y: auto; }
.tab{
  display:flex; flex-direction: column; align-items:center; justify-content:center; gap: 4px;
  min-height: 64px; padding: 8px 2px; border-radius: var(--r-md); border: 1px solid transparent; background: transparent;
  color: var(--text-2); font-size: 12.5px; font-weight: 540; line-height: 1.15; text-align: center;
  transition: background .2s, color .2s, border-color .2s;
}
.tab svg{ width: 22px; height: 22px; }
.tab:hover{ color: var(--text); background: var(--glass-2); }
.tab[aria-selected="true"]{ color: var(--text); background: var(--glass-3); border-color: var(--border); }
.panel{ min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 20px 20px 32px; scrollbar-width: thin; scrollbar-color: var(--border-2) transparent; }
.tabpanel[hidden]{ display:none; }
.panel h2{ margin: 0 0 4px; font-size: 21px; font-weight: 650; letter-spacing: -.015em; }
.panel .lead{ margin: 0 0 20px; color: var(--text-2); font-size: 14px; }
.sec{ padding: 16px 0; border-top: 1px solid var(--border); }
.sec:first-of-type{ border-top: 0; padding-top: 4px; }
.sec > h3{ margin: 0 0 12px; font-size: 15px; font-weight: 620; display:flex; align-items:center; justify-content: space-between; gap: 8px; }
.sec > h3 small{ font-size: 14px; font-weight: 450; color: var(--text-2); }
.row{ margin: 12px 0; }
.row:first-child{ margin-top: 0; }
.row:last-child{ margin-bottom: 0; }

/* slider */
.slider label{ display:flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 14px; color: var(--text-2); margin-bottom: 2px; }
.slider output{ color: var(--text); font-variant-numeric: tabular-nums; font-size: 14px; }
input[type=range]{
  -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; margin: 0; cursor: pointer;
  --p: 50%;
}
input[type=range]::-webkit-slider-runnable-track{ height: 4px; border-radius: 4px; background: linear-gradient(to right, var(--accent) var(--p), var(--track) var(--p)); }
input[type=range]::-moz-range-track{ height: 4px; border-radius: 4px; background: linear-gradient(to right, var(--accent) var(--p), var(--track) var(--p)); }
input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 1px 3px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.06); transition: transform .15s; }
input[type=range]::-moz-range-thumb{ width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 1px 3px rgba(0,0,0,.35); }
input[type=range]:active::-webkit-slider-thumb{ transform: scale(1.15); }
input[type=range]:focus-visible{ outline: none; }
input[type=range]:focus-visible::-webkit-slider-thumb{ box-shadow: 0 0 0 3px var(--accent); }

/* color */
.color{ display:flex; align-items:center; justify-content: space-between; gap: 12px; min-height: 44px; }
.color > span{ font-size: 14px; color: var(--text-2); }
.color-ctl{ display:flex; align-items:center; gap: 8px; }
.swatch{ position: relative; width: 36px; height: 36px; border-radius: var(--r-sm); border: 1px solid var(--border-2); overflow: hidden; flex:none; box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
.swatch input{ position:absolute; inset:-8px; width: calc(100% + 16px); height: calc(100% + 16px); opacity: 0; cursor: pointer; border:0; padding:0; }
.hex{ width: 92px; height: 36px; padding: 0 10px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--glass-2); font-size: 14px; font-variant-numeric: tabular-nums; text-transform: uppercase; }
.hex:focus{ outline: none; border-color: var(--accent); }
.palette{ display:flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.palette button{ width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--border-2); padding: 0; position: relative; }
.palette button::after{ content:""; position:absolute; inset:-10px; }

/* chips (segmented) */
.chips-label{ font-size: 14px; color: var(--text-2); margin-bottom: 8px; display:block; }
.chips{ display:flex; flex-wrap: wrap; gap: 6px; }
.chip{
  display:inline-flex; align-items:center; gap: 8px; min-height: 36px; padding: 0 12px; border-radius: var(--r-sm);
  border: 1px solid var(--border); background: var(--glass-2); font-size: 14px; color: var(--text-2);
  transition: background .2s, color .2s, border-color .2s; position: relative;
}
.chip::after{ content:""; position:absolute; inset: -4px 0; }
.chip:hover{ color: var(--text); border-color: var(--border-2); }
.chip[aria-pressed="true"], .chip[aria-checked="true"]{ color: var(--text); background: var(--glass-3); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.chips.seg{ display:grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; background: var(--glass-2); border: 1px solid var(--border); border-radius: var(--r-md); }
.chips.seg .chip{ justify-content:center; border-color: transparent; background: transparent; min-height: 36px; padding: 0 8px; }
.chips.seg .chip[aria-pressed="true"]{ background: var(--glass-3); border-color: var(--border-2); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.fdot{ width: 14px; height: 14px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
.f-matte{ background: #8b8b8b; }
.f-satin{ background: radial-gradient(circle at 35% 30%, #c9c9c9, #6c6c6c 70%); }
.f-gloss{ background: radial-gradient(circle at 32% 28%, #fff 0 12%, #777 22%, #2a2a2a 80%); }
.f-glass{ background: radial-gradient(circle at 32% 28%, #fff 0 10%, rgba(140,180,255,.35) 22%, rgba(80,120,220,.6) 85%); }
.f-metal{ background: linear-gradient(140deg, #f2f2f2, #8a8a8a 45%, #dcdcdc 60%, #5d5d5d); }
.f-chrome{ background: linear-gradient(180deg, #fff 0 38%, #3b3b3b 42%, #9a9a9a 70%, #ececec); }
.f-holo{ background: conic-gradient(from 40deg, #ff9ad5, #9ad1ff, #b8ffcf, #fff59a, #ff9ad5); }
.f-neon{ background: #42e8ff; box-shadow: 0 0 8px 1px rgba(66,232,255,.8); }

/* tiles */
.tiles{ display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.tiles.cols4{ grid-template-columns: repeat(4, minmax(0,1fr)); }
.tile{
  display:flex; flex-direction: column; align-items:center; justify-content:center; gap: 6px;
  min-height: 76px; padding: 10px 4px 8px; border-radius: var(--r-md);
  border: 1px solid var(--border); background: var(--glass-2); color: var(--text-2);
  font-size: 13px; line-height: 1.15; text-align:center;
  transition: background .2s, color .2s, border-color .2s, transform .12s;
}
.tile svg{ width: 28px; height: 28px; }
.tile:hover{ color: var(--text); border-color: var(--border-2); }
.tile:active{ transform: scale(.97); }
.tile[aria-pressed="true"]{ color: var(--text); background: var(--glass-3); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

/* toggle */
.toggle{ display:flex; align-items:center; justify-content: space-between; gap: 12px; min-height: 44px; cursor: pointer; font-size: 14px; color: var(--text-2); }
.toggle input{ position:absolute; opacity:0; width:1px; height:1px; }
.switch{ width: 40px; height: 24px; border-radius: 12px; background: var(--track); position: relative; flex:none; transition: background .2s; border: 1px solid var(--border); }
.switch::after{ content:""; position:absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .22s cubic-bezier(.3,.8,.3,1); }
.toggle input:checked + .switch{ background: var(--accent); }
.toggle input:checked + .switch::after{ transform: translateX(16px); }
.toggle input:focus-visible + .switch{ outline: 2px solid var(--accent); outline-offset: 2px; }

/* presets */
.presets{ display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.preset{ padding: 0; border: 1px solid var(--border); background: var(--glass-2); border-radius: var(--r-md); overflow: hidden; text-align: left; transition: border-color .2s, transform .15s; position: relative; }
.preset:hover{ border-color: var(--border-2); transform: translateY(-1px); }
.preset[aria-pressed="true"]{ border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.preset .thumb{ display:block; width:100%; aspect-ratio:1; background: #111 center/cover no-repeat; }
.preset .thumb.loading{ background-image: linear-gradient(110deg, rgba(255,255,255,.03) 30%, rgba(255,255,255,.09) 50%, rgba(255,255,255,.03) 70%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
@keyframes shimmer{ to{ background-position: -200% 0; } }
.preset .name{ display:block; padding: 7px 10px 8px; font-size: 13px; font-weight: 540; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.preset .del{ position:absolute; top: 6px; right: 6px; width: 28px; height: 28px; border-radius: 7px; border: 1px solid rgba(255,255,255,.2); background: rgba(10,10,14,.5); color: #fff; display:none; align-items:center; justify-content:center; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.preset .del::after{ content:""; position:absolute; inset:-8px; }
.preset:hover .del, .preset:focus-within .del{ display:flex; }
.preset .del svg{ width: 14px; height: 14px; }
.empty{ padding: 16px; border: 1px dashed var(--border-2); border-radius: var(--r-md); color: var(--text-2); font-size: 14px; text-align: center; }

/* light pad */
.lightpad-row{ display:grid; grid-template-columns: 132px 1fr; gap: 16px; align-items: center; }
.lightpad{ position: relative; width: 132px; height: 132px; border-radius: 50%; border: 1px solid var(--border-2); background: radial-gradient(circle at 50% 50%, var(--glass-3), var(--glass-2) 70%); touch-action: none; cursor: crosshair; }
.lightpad::before{ content:""; position:absolute; inset: 30%; border-radius:50%; border: 1px dashed var(--border-2); }
.lightpad .dot{ position:absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(255,255,255,.18), 0 0 18px 4px rgba(255,255,255,.55); }
.lightpad .orb{ position:absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: var(--track); }

.btn-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.note{ font-size: 14px; color: var(--text-2); margin: 8px 0 0; }
.progress{ height: 4px; border-radius: 4px; background: var(--track); overflow:hidden; margin-top: 12px; display:none; }
.progress i{ display:block; height:100%; width: 0; background: var(--accent); transition: width .15s; }

/* toast */
.toast{ position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); z-index: 20; padding: 10px 16px; border-radius: var(--r-md); font-size: 14px; opacity: 0; pointer-events:none; transition: opacity .25s, transform .25s; background: var(--glass); border: 1px solid var(--border-2); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); box-shadow: var(--shadow); }
.toast.show{ opacity: 1; transform: translate(-50%, 0); }

/* responsive */
@media (max-width: 1180px){
  .layout{ grid-template-columns: minmax(0,1fr) 404px; }
  .tiles.cols4{ grid-template-columns: repeat(3, minmax(0,1fr)); }
}
@media (max-width: 900px){
  body{ overflow: auto; }
  .app{ height: auto; min-height: 100dvh; padding: 12px; gap: 12px; }
  .topbar{ padding: 6px 6px 6px 12px; }
  .brand span{ font-size: 12px; }
  .brand .sub{ display:none; }
  .btn .lbl{ display:none; }
  .btn{ padding: 0 12px; }
  .layout{ grid-template-columns: 1fr; }
  .stage{ padding: 12px; }
  .canvas-wrap, .stage-bar{ width: 100%; }
  .stage-bar{ flex-wrap: wrap; justify-content: center; }
  .inspector{ grid-template-columns: 1fr; grid-template-rows: auto 1fr; overflow: visible; }
  .rail{ flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--border); padding: 8px; position: sticky; top: 0; z-index: 2; scrollbar-width: none; border-radius: var(--r-lg) var(--r-lg) 0 0; background: var(--glass); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
  .tab{ min-width: 76px; min-height: 60px; flex: none; }
  .panel{ overflow: visible; padding: 16px 16px 24px; }
  .presets{ grid-template-columns: repeat(3, minmax(0,1fr)); }
}
@media (max-width: 420px){
  .presets{ grid-template-columns: repeat(2, minmax(0,1fr)); }
  .lightpad-row{ grid-template-columns: 116px 1fr; }
  .lightpad{ width: 116px; height: 116px; }
}
@media (prefers-reduced-motion: reduce){
  *{ transition-duration: .01ms !important; animation: none !important; }
}
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>
<div class="app">
  <header class="topbar glass">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <radialGradient id="lg1" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#bfe0ff"/><stop offset=".45" stop-color="#4f8dff"/><stop offset="1" stop-color="#14307a"/></radialGradient>
          <radialGradient id="lg2" cx="35%" cy="20%" r="80%"><stop offset="0" stop-color="#9cc6ff"/><stop offset=".5" stop-color="#2f66e0"/><stop offset="1" stop-color="#0f245e"/></radialGradient>
        </defs>
        <circle cx="16" cy="10" r="6.5" fill="url(#lg1)"/>
        <path d="M4 32a12 12 0 0 1 24 0z" fill="url(#lg2)"/>
      </svg>
      <div><b>Сфера</b><span><em class="sub">студия аватаров · </em>by <strong class="author">fatumurfate</strong></span></div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Сменить тему"></button>

precision highp float;
precision highp int;

uniform vec2 uOffset;
uniform float uTime;
uniform float uZoom;
uniform float uPanY;
uniform float uPixel;

uniform vec3 uHeadPos;
uniform vec3 uHeadScale;
uniform float uHeadR;
uniform mat3 uHeadRot;
uniform vec3 uBodyPos;
uniform vec3 uBodyScale;
uniform float uBodyR;

uniform int uZero;
uniform vec4 uPop;
uniform float uPopFx;
uniform float uOrbit;

uniform vec4 uMA[8];
uniform vec4 uMB[8];
uniform vec4 uMC[8];
uniform vec4 uMD[8];
uniform vec4 uME[8];
uniform vec4 uMF[8];
uniform int uPat[8];

uniform vec4 uFaceA;
uniform vec4 uFaceB;
uniform vec3 uBlushCol;

uniform vec3 uKeyDir;
uniform vec3 uKeyCol;
uniform vec3 uRimCol;
uniform float uAmb;
uniform float uEnvInt;
uniform float uEnvRot;
uniform float uShadow;
uniform float uExposure;

uniform vec3 uBg1;
uniform vec3 uBg2;
uniform vec2 uBgDir;
uniform float uVignette;
uniform float uGrain;
uniform float uAlphaBg;

#define PI 3.14159265
#define TAU 6.2831853
#define CAMZ 6.0
#define TH 0.2667
#define BZ 3.0

// ---------------------------------------------------------------- helpers
mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }
float smin(float a,float b,float k){ float h=clamp(0.5+0.5*(b-a)/k,0.,1.); return mix(b,a,h)-k*h*(1.-h); }
float smax(float a,float b,float k){ return -smin(-a,-b,k); }
vec2 U(vec2 a, vec2 b){ return a.x<b.x?a:b; }
float sdEllipsoid(vec3 p, vec3 r){ float k0=length(p/r); float k1=length(p/(r*r)); return k0*(k0-1.0)/max(k1,1e-5); }
float sdTorusY(vec3 p, float R, float r){ return length(vec2(length(p.xz)-R, p.y))-r; }
float sdTorusZ(vec3 p, float R, float r){ return length(vec2(length(p.xy)-R, p.z))-r; }
float sdTorusX(vec3 p, float R, float r){ return length(vec2(length(p.yz)-R, p.x))-r; }
float sdCapsule(vec3 p, vec3 a, vec3 b, float r){ vec3 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h)-r; }
float sdCylY(vec3 p, float r, float h){ vec2 d=abs(vec2(length(p.xz),p.y))-vec2(r,h); return min(max(d.x,d.y),0.)+length(max(d,0.)); }
float sdCylX(vec3 p, float r, float h){ return sdCylY(p.yxz, r, h); }
float sdBox2(vec2 p, vec2 b, float r){ vec2 q=abs(p)-b+r; return length(max(q,0.))+min(max(q.x,q.y),0.)-r; }
float sdOcta(vec3 p, float s){ p=abs(p); return (p.x+p.y+p.z-s)*0.57735027; }
float dot2(vec2 v){ return dot(v,v); }
float sdRoundCone(vec3 p, vec3 a, vec3 b, float r1, float r2){
  vec3 ba=b-a; float l2=dot(ba,ba); float rr=r1-r2; float a2=l2-rr*rr; float il2=1.0/l2;
  vec3 pa=p-a; float y=dot(pa,ba); float z=y-l2; vec3 xv=pa*l2-ba*y; float x2=dot(xv,xv);
  float y2=y*y*l2; float z2=z*z*l2; float k=sign(rr)*rr*rr*x2;
  if(sign(z)*a2*z2>k) return sqrt(x2+z2)*il2-r2;
  if(sign(y)*a2*y2<k) return sqrt(x2+y2)*il2-r1;
  return (sqrt(x2*a2*il2)+y*rr)*il2-r1;
}
float sdArc(vec2 p, float ap, float ra, float rb){
  vec2 sc = vec2(sin(ap), cos(ap));
  p.x = abs(p.x);
  return ((sc.y*p.x>sc.x*p.y) ? length(p-sc*ra) : abs(length(p)-ra)) - rb;
}
float sdHeart(vec2 p){
  p.x = abs(p.x);
  if(p.y+p.x>1.0) return sqrt(dot2(p-vec2(0.25,0.75)))-sqrt(2.0)/4.0;
  return sqrt(min(dot2(p-vec2(0.00,1.00)), dot2(p-0.5*max(p.x+p.y,0.0))))*sign(p.x-p.y);
}
float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*0.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float hash13(vec3 p3){ p3=fract(p3*0.1031); p3+=dot(p3,p3.zyx+31.32); return fract((p3.x+p3.y)*p3.z); }
float noise3(vec3 p){
  vec3 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(mix(hash13(i),hash13(i+vec3(1,0,0)),f.x), mix(hash13(i+vec3(0,1,0)),hash13(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash13(i+vec3(0,0,1)),hash13(i+vec3(1,0,1)),f.x), mix(hash13(i+vec3(0,1,1)),hash13(i+vec3(1,1,1)),f.x),f.y), f.z);
}
float fbm(vec3 p){ float s=0., a=0.5; for(int i=0;i<4;i++){ s+=a*noise3(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=0.5; } return s; }
vec3 surfFront(vec2 xy, vec3 hs){
  float z = hs.z*sqrt(max(0., 1.-xy.x*xy.x/(hs.x*hs.x)-xy.y*xy.y/(hs.y*hs.y)));
  return vec3(xy, z);
}

// ---------------------------------------------------------------- accessories (unit head space)
// ids: 0 head, 1 body, 2 hat, 3 eyewear, 4 ears, 5 neck, 6 fx, 7 accent
#if HAT>0
vec2 hatSdf(vec3 u, vec3 hs){
  const int t = HAT;
  float top = hs.y;
  vec2 r = vec2(1e5, 2.);
#if HAT==1
    vec3 q = u - vec3(0., top+0.34, 0.);
    q.yz = rot(0.3)*q.yz;
    r = vec2(sdTorusY(q, 0.5, 0.05), 2.);
#elif HAT==2
    vec3 q = u - vec3(0., top*0.8, 0.);
    float R = 0.6*hs.x;
    float a = atan(q.z,q.x);
    float sec = TAU/7.;
    float aa = mod(a+sec*0.5, sec) - sec*0.5;
    float sp = 1.-abs(aa)/(sec*0.5);
    float hTop = 0.2 + 0.26*sp*sp;
    float rr = length(q.xz);
    float shell = abs(rr-R)-0.032;
    float d = max(shell, max(-q.y, q.y-hTop))*0.6;
    vec3 g = vec3(cos(aa)*rr, q.y, sin(aa)*rr);
    float gem = length(g-vec3(R, 0.47, 0.))-0.05;
    float bg = length(g-vec3(R+0.03, 0.1, 0.))-0.04;
    r = U(vec2(d,2.), vec2(min(gem,bg),7.));
#elif HAT==3
    vec3 q = u - vec3(0., top*0.84, 0.);
    q.xy = rot(-0.14)*q.xy;
    float brim = sdCylY(q, 0.88, 0.018)-0.02;
    float body = sdCylY(q-vec3(0.,0.38,0.), 0.5, 0.36)-0.025;
    float band = sdCylY(q-vec3(0.,0.11,0.), 0.53, 0.07)-0.004;
    r = U(vec2(min(brim,body),2.), vec2(band,7.));
#elif HAT==4
    vec3 q = u;
    float ang = atan(q.z,q.x);
    float cap = sdEllipsoid(q, hs*1.055);
    cap = smax(cap, top*0.3 - q.y, 0.02);
    cap -= 0.006*(0.5+0.5*sin(ang*36.));
    float y0 = top*0.34;
    float rad = hs.x*1.07*sqrt(max(0.,1.-0.34*0.34));
    vec3 c = q-vec3(0.,y0,0.);
    float cuff = length(vec2(length(c.xz)-rad, c.y*0.6))-0.1;
    cuff -= 0.008*(0.5+0.5*sin(ang*48.));
    float pom = length(q-vec3(0.,top+0.14,0.))-0.19;
    pom += 0.012*sin(q.x*55.)*sin(q.y*55.)*sin(q.z*55.);
    r = vec2(min(smin(cap,cuff,0.03), pom)*0.8, 2.);
#elif HAT==5
    vec3 q = u; q.x = abs(q.x);
    vec3 a = vec3(0.52*hs.x, 0.7*top, 0.), b = vec3(0.8*hs.x, 1.3*top, 0.04);
    float e = sdRoundCone(vec3(q.xy, q.z*2.0), a, b, 0.26, 0.035)*0.5;
    float ei = sdRoundCone(vec3(q.xy, (q.z-0.075)*2.0), a+vec3(0.0,0.1,0.), b+vec3(-0.02,-0.1,0.), 0.15, 0.02)*0.5;
    r = U(vec2(e,2.), vec2(ei,7.));
#elif HAT==6
    vec3 q = u; q.x = abs(q.x);
    float hy = max(q.y - 0.72*top, 0.);
    q.x -= 0.4*hy*hy;
    q.z += 0.15*hy*hy;
    float h = sdRoundCone(q, vec3(0.42*hs.x,0.7*top,0.12), vec3(0.55*hs.x, 1.3*top, 0.1), 0.15, 0.025)*0.7;
    r = vec2(h, 2.);
#elif HAT==7
    vec3 q = u; q.x = abs(q.x);
    vec3 a = vec3(0.22*hs.x, 0.93*top, 0.05), b = vec3(0.44*hs.x, top+0.5, 0.1);
    float st = sdCapsule(q, a, b, 0.022);
    float ball = length(q-b)-0.085;
    r = U(vec2(st,2.), vec2(ball,7.));
#elif HAT==8
    vec3 c = normalize(vec3(0.5, 0.82, 0.28))*hs;
    vec3 q = u - c;
    q.xy = rot(-0.55)*q.xy;
    float l1 = sdRoundCone(vec3(abs(q.x), q.y, q.z*2.4), vec3(0.03,0.,0.), vec3(0.24,0.,0.), 0.05, 0.15)/2.4;
    float knot = length(vec3(q.x*1.1, q.y, q.z*1.4)) - 0.065;
    r = vec2(min(l1, knot), 2.);
#endif
  return r;
}
#endif

#if EYE>0
vec2 eyeSdf(vec3 u, vec3 hs){
  const int t = EYE;
  float ey = 0.08 + uFaceB.y;
  float ex = 0.36*uFaceB.w;
  vec2 r = vec2(1e5, 3.);
#if EYE==1 || EYE==3
    vec3 q = u; q.x = abs(q.x);
    vec3 c = surfFront(vec2(ex, ey), hs) + vec3(0.,0.,0.07);
    vec3 l = q - c; l.xz = rot(-0.4)*l.xz;
    float ring, lens; float rr = 0.21;
    if(t==1){
      ring = sdTorusZ(l, rr, 0.026);
      lens = max(length(l.xy)-rr, abs(l.z)-0.006);
    } else {
      float d2 = sdBox2(l.xy, vec2(0.21,0.14), 0.11);
      lens = max(d2, abs(l.z)-0.012);
      ring = max(abs(d2)-0.022, abs(l.z)-0.03);
      rr = 0.21;
    }
    vec3 inner = c + vec3(-0.193*rr/0.21, 0.02, 0.082);
    vec3 b0 = vec3(0., ey+0.05, surfFront(vec2(0.,ey+0.05),hs).z+0.08);
    float bridge = sdCapsule(q, b0, inner, 0.022);
    vec3 outer = c + vec3(0.193, 0.0, -0.082);
    vec3 p2 = normalize(vec3(0.93, ey, 0.33))*hs*1.035;
    vec3 p3 = vec3(hs.x*1.03, ey, -0.2);
    float temple = min(sdCapsule(q, outer, p2, 0.02), sdCapsule(q, p2, p3, 0.02));
    r = U(vec2(min(min(ring, bridge), temple), 3.), vec2(lens, t==3 ? 3. : 7.));
#elif EYE==2
    vec3 q = u/hs; float m = min(hs.x, min(hs.y, hs.z));
    float sh = abs(length(q)-1.07)-0.03;
    float band = abs(q.y-ey)-0.17;
    float vis = smax(smax(sh, band, 0.03), 0.25 - q.z, 0.06)*m;
    float sh2 = abs(length(q)-1.03)-0.016;
    float strap = max(sh2, abs(q.y-ey)-0.06)*m;
    r = U(vec2(vis,7.), vec2(strap,3.));
#elif EYE==4
    vec3 q = u;
    vec3 c = surfFront(vec2(-ex, ey), hs) + vec3(0.,0.,0.07);
    vec3 l = q - c; l.xz = rot(0.4)*l.xz;
    float ring = sdTorusZ(l, 0.22, 0.032);
    float lens = max(length(l.xy)-0.22, abs(l.z)-0.006);
    vec3 a = c + vec3(0.0, -0.24, 0.0);
    vec3 m1 = normalize(vec3(-0.5, -0.55, 0.75))*hs*1.03;
    vec3 m2 = normalize(vec3(-0.62, -0.85, 0.35))*hs*1.03;
    float chain = min(sdCapsule(q, a, m1, 0.01), sdCapsule(q, m1, m2, 0.01));
    r = U(vec2(min(ring, chain), 3.), vec2(lens, 7.));
#elif EYE==5
    vec3 q = u/hs; float m = min(hs.x, min(hs.y, hs.z));
    float sh = abs(length(q)-1.02)-0.022;
    float band = abs(q.y - ey - 0.02 - 0.08*q.x*q.x) - (0.17 - 0.06*abs(q.x));
    float holes = length(vec2(abs(q.x)-ex*0.94, (q.y-ey)*1.3)) - 0.11*uFaceB.x;
    float d = smax(smax(smax(sh, band, 0.04), 0.2 - q.z, 0.05), -holes, 0.02)*m;
    r = vec2(d, 3.);
#endif
  return r;
}
#endif

#if EAR>0
vec2 earSdf(vec3 u, vec3 hs){
  const int t = EAR;
  vec2 r = vec2(1e5, 4.);
#if EAR==1 || EAR==4
    vec3 q = u;
    float m = min(hs.x, hs.y);
    float band = length(vec2((length(q.xy/hs.xy)-1.12)*m, q.z)) - 0.055;
    band = smax(band, -q.y - 0.02, 0.02);
    vec3 q2 = q; if(t==1) q2.x = abs(q2.x);
    vec3 c = q2 - vec3(hs.x*1.04, 0., 0.);
    float cup = sdCylX(c - vec3(0.05,0.,0.), 0.26, 0.06) - 0.06;
    float cush = sdTorusX(c + vec3(0.05,0.,0.), 0.2, 0.07);
    if(t==4){
      cup = q.x < 0. ? sdCylX(vec3(q.x + hs.x*1.04, q.yz), 0.12, 0.04)-0.03 : cup;
      vec3 a = vec3(hs.x*1.08, -0.1, 0.15);
      vec3 m1 = normalize(vec3(0.82, -0.42, 0.62))*hs*1.1;
      vec3 b = surfFront(vec2(0.22, -0.42), hs) + vec3(0.,0.,0.07);
      float boom = min(sdCapsule(q, a, m1, 0.018), sdCapsule(q, m1, b, 0.018));
      float mic = length(q-b) - 0.05;
      r = U(vec2(min(min(band, cup), boom), 4.), vec2(min(cush, mic), 7.));
    } else {
      r = U(vec2(min(band, cup), 4.), vec2(cush, 7.));
    }
#elif EAR==2
    vec3 q = u; q.x = abs(q.x);
    vec3 s0 = normalize(vec3(0.97,-0.2,0.12))*hs*1.01;
    vec3 s1 = s0 + vec3(0.05, -0.3, 0.02);
    float stud = length(q-s0)-0.04;
    float ch = sdCapsule(q, s0, s1, 0.011);
    float ball = length(q-s1-vec3(0.,-0.07,0.))-0.085;
    r = U(vec2(min(stud,ch),4.), vec2(ball,7.));
#elif EAR==3
    vec3 q = u; q.x = abs(q.x);
    vec3 s0 = normalize(vec3(0.97,-0.2,0.12))*hs*1.01;
    vec3 c = q - (s0 + vec3(0.06, -0.15, 0.03));
    c.xz = rot(0.9)*c.xz;
    float hoop = sdTorusX(c.zyx, 0.15, 0.022);
    hoop = sdTorusZ(c, 0.15, 0.022);
    r = vec2(hoop, 4.);
#endif
  return r;
}
#endif

#if FXS>0
vec2 fxSdf(vec3 u){
  vec3 q = u; q.yz = rot(0.42)*q.yz; q.xy = rot(0.2)*q.xy;
  float d = 1e5;
  if((FX&1)!=0){ float rr = length(q.xz); d = min(d, sdBox2(vec2(rr-1.62, q.y), vec2(0.24, 0.008), 0.007)); }
  if((FX&2)!=0){ vec3 c = vec3(cos(uOrbit), 0., sin(uOrbit))*1.92; d = min(d, length(q-c)-0.13); }
  return vec2(d, 6.);
}
#endif

#if NECK>0
vec2 neckSdf(vec3 v, vec3 bs){
  const int t = NECK;
  vec3 q = v/bs; float m = min(bs.x, min(bs.y, bs.z));
  vec3 w = q; w.yz = rot(0.42)*w.yz;
  float y0 = 0.9; float R0 = sqrt(1.-y0*y0);
  vec2 r = vec2(1e5, 5.);
#if NECK==1
    float pr = 0.045;
    float sec = TAU/30.;
    float a = atan(w.z,w.x); float aa = mod(a+sec*.5,sec)-sec*.5; float rr = length(w.xz);
    vec3 g = vec3(cos(aa)*rr, w.y, sin(aa)*rr) - vec3(R0*(1.+pr), y0*(1.+pr), 0.);
    r = vec2((length(g)-pr)*m, 5.);
#elif NECK==2
    float rr = length(w.xz); float a = atan(w.z, w.x);
    vec2 cs = vec2(rr - R0*1.03, w.y - y0*1.03);
    float d = length(cs) - 0.03 + 0.009*abs(sin(a*55.));
    r = vec2(d*m*0.8, 5.);
#elif NECK==3
    float rr = length(w.xz);
    vec2 cs = vec2(rr - R0*1.012, w.y - y0*1.012);
    float d = length(cs) - 0.011;
    float c = cos(0.42), s = sin(0.42);
    vec3 fp = vec3(0., c*y0 - s*R0, s*y0 + c*R0);
    vec3 gc = normalize(fp)*1.07 + vec3(0.,-0.07,0.);
    vec3 gq = q - gc; gq.y *= 0.75;
    float gem = sdOcta(gq, 0.085) - 0.004;
    float bail = sdTorusX(q - normalize(fp)*1.03 - vec3(0.,-0.005,0.), 0.022, 0.008);
    r = U(vec2(min(d, bail)*m, 5.), vec2(gem*m*0.8, 7.));
#elif NECK==4
    vec3 n = normalize(vec3(0., 0.76, 0.65));
    vec3 tx = vec3(1.,0.,0.); vec3 ty = cross(n, tx);
    vec3 d = q - n*1.045;
    vec3 l = vec3(dot(d,tx), dot(d,ty), dot(d,n));
    float lob = sdRoundCone(vec3(abs(l.x), l.y, l.z*2.5), vec3(0.02,0.,0.), vec3(0.2,0.,0.), 0.04, 0.12)/2.5;
    float knot = length(vec3(l.x*1.2, l.y, l.z*1.6)) - 0.055;
    r = vec2(min(lob, knot)*m, 5.);
#elif NECK==5
    vec3 w2 = q; w2.yz = rot(0.18)*w2.yz;
    float ys = 0.88; float Rs = sqrt(1.-ys*ys);
    float rr = length(w2.xz); float a = atan(w2.z, w2.x);
    float d = length(vec2(rr - Rs - 0.06, (w2.y - ys - 0.02)*0.85)) - 0.13;
    d -= 0.008*(0.5+0.5*sin(a*40.))*(0.5+0.5*sin(w2.y*60.));
    vec3 ta = normalize(vec3(0.3, 0.86, 0.42))*1.06;
    vec3 tb = normalize(vec3(0.36, 0.62, 0.7))*1.06;
    vec3 tq = q;
    float tail = sdCapsule(tq, ta, tb, 0.085);
    r = vec2(smin(d, tail, 0.04)*m*0.85, 5.);
#endif
  return r;
}
#endif

// ---------------------------------------------------------------- scene
float gB = 1e5; bool gSh = false;
vec2 map(vec3 p){
  gB = 1e5;
  vec3 hq = uHeadRot*(p-uHeadPos);
  vec3 hs = uHeadScale;
  vec2 res = vec2(sdEllipsoid(hq, uHeadR*hs), 0.);
  vec3 bq = p-uBodyPos;
  res = U(res, vec2(sdEllipsoid(bq, uBodyR*uBodyScale), 1.));
#if HEADACC
  {
    vec3 u = hq/uHeadR;
    float lu = length(u);
    if(lu > 2.45){ float bd = (lu-2.35)*uHeadR; gB = min(gB, bd); if(!gSh) res.x = min(res.x, bd); }
    else {
      vec2 a;
#if HAT>0
      if(uPop.x>0.01){ float s=uPop.x; vec3 an=vec3(0.,hs.y,0.); a=hatSdf((u-an)/s+an, hs); a.x*=s*uHeadR; res=U(res,a); }
#endif
#if EYE>0
      if(uPop.y>0.01){ float s=uPop.y; vec3 an=vec3(0.,0.1,hs.z); a=eyeSdf((u-an)/s+an, hs); a.x*=s*uHeadR; res=U(res,a); }
#endif
#if EAR>0
      if(uPop.z>0.01){ float s=uPop.z; vec3 an=vec3(sign(u.x)*hs.x,0.,0.); a=earSdf((u-an)/s+an, hs); a.x*=s*uHeadR; res=U(res,a); }
#endif
#if FXS>0
      if(uPopFx>0.01){ float s=uPopFx; a=fxSdf(u/s); a.x*=s*uHeadR; res=U(res,a); }
#endif
    }
  }
#endif
#if NECK>0
  if(uPop.w>0.01){
    vec3 v = bq/uBodyR;
    float lv = length(v/uBodyScale);
    if(lv < 1.5){ float s=uPop.w; vec3 an=vec3(0.,uBodyScale.y*0.9,0.3); vec2 a=neckSdf((v-an)/s+an, uBodyScale); a.x*=s*uBodyR; res=U(res,a); }
    else { float bd = (lv-1.4)*uBodyR*min(uBodyScale.x, uBodyScale.y); gB = min(gB, bd); if(!gSh) res.x = min(res.x, bd); }
  }
#endif
  return res;
}

vec3 calcN(vec3 p){
  vec3 n = vec3(0.);
  for(int i=uZero; i<4; i++){
    vec3 e = 0.5773*(2.0*vec3(float(((i+3)>>1)&1), float((i>>1)&1), float(i&1)) - 1.0);
    n += e*map(p + e*0.0007).x;
  }
  return normalize(n);
}

// ---------------------------------------------------------------- background & environment
vec3 bgCol(vec2 s){
  vec3 c;
  if(uBgType==0) c = uBg1;
  else if(uBgType==1){ float t = clamp(dot(s, uBgDir)*0.5+0.5, 0., 1.); c = mix(uBg1, uBg2, t*t*(3.-2.*t)); }
  else if(uBgType==2){ float t = clamp(length(s - vec2(0.,0.15))/1.5, 0., 1.); c = mix(uBg1, uBg2, t*t*(3.-2.*t)); }
  else {
    float n = sin(s.x*1.6 + 0.8 + sin(s.y*1.3)*1.2)*0.5 + sin(s.y*2.1 - s.x*0.9 + 2.0)*0.5;
    float n2 = sin(s.x*2.7 - s.y*1.9 + 4.0);
    vec3 c3 = mix(uBg1, uBg2, 0.5) * vec3(1.25, 0.85, 1.15);
    c = mix(uBg1, uBg2, smoothstep(-0.7, 0.7, n));
    c = mix(c, c3, smoothstep(0.4, 1.0, n2)*0.5);
  }
  float v = 1. - uVignette*smoothstep(0.45, 1.75, length(s));
  return c*v;
}

float band(float x, float h, float w){ return 1.-smoothstep(h-w, h+w, x); }
float rectL(float el, float az, float ce, float ca, float he, float ha, float w){
  float da = abs(mod(az-ca+PI, TAU)-PI);
  return band(abs(el-ce), he, w)*band(da, ha, w);
}
float arcH(float el, float az, float ce, float ca, float hl, float th, float w){
  float da = mod(az-ca+PI, TAU)-PI;
  float t = clamp(abs(da)/hl, 0., 1.);
  return band(abs(el-ce), th*(1.-0.7*t*t), w)*(1.-smoothstep(0.45, 1., t));
}
float arcV(float el, float az, float ca, float ce, float hl, float th, float w){
  float da = abs(mod(az-ca+PI, TAU)-PI)*cos(el);
  float t = clamp(abs(el-ce)/hl, 0., 1.);
  return band(da, th*(1.-0.7*t*t), w)*(1.-smoothstep(0.45, 1., t));
}
float rbox(float el, float az, float ce, float ca, vec2 b, float r, float w){
  vec2 p = vec2((mod(az-ca+PI, TAU)-PI)*cos(el), el-ce);
  vec2 q = abs(p)-b+r;
  float d = length(max(q,0.))+min(max(q.x,q.y),0.)-r;
  return (1.-smoothstep(-w, w+0.04, d))*(0.8+0.2*smoothstep(b.y, -b.y, p.y));
}
vec3 envBase(vec3 d){
  vec3 avg = (uBg1+uBg2)*0.5;
  return avg*mix(0.18, 1.0, smoothstep(-0.6, 0.9, d.y));
}
vec3 envMap(vec3 d, float r){
  float el = asin(clamp(d.y,-1.,1.));
  float az = atan(d.x, d.z) - uEnvRot;
  float w = 0.012 + r*0.12 + r*r*0.7;
  float att = 1./(1.+r*2.5);
  vec3 base = envBase(d);
  float L = 0.;
  vec3 Lc = vec3(0.);
#if ENV==0 // studio: soft key, curved strip arcs, edge strip, low kicker, faint dome
    L += 2.6*rbox(el,az, 0.5, -0.6, vec2(0.2,0.15), 0.1, w+0.015);
    L += 2.4*arcH(el,az, 0.74, -0.35, 1.05, 0.028, w);
    L += 2.0*arcV(el,az, 2.25, 0.22, 0.85, 0.03, w);
    L += 0.9*arcH(el,az, -0.22, -2.1, 0.8, 0.026, w);
    L += 0.5*arcV(el,az, -1.25, 0.35, 0.5, 0.05, w+0.02);
    L += 0.14*smoothstep(0.35, 1.45, el);
#elif ENV==1 // big softbox
    L += 1.8*rectL(el,az, 0.55, -0.3, 0.5, 0.75, w+0.05);
    L += 0.45*rectL(el,az, 0.0, 1.2, 0.4, 0.35, w+0.05);
    L += 0.12*smoothstep(0.2, 1.4, el);
#elif ENV==2 // ring light
    vec3 cd = normalize(vec3(-0.12,0.18,1.));
    float ang = acos(clamp(dot(d, cd),-1.,1.));
    L += 3.*band(abs(ang-0.42), 0.035, w);
    L += 0.45*rbox(el,az, 1.05, 0.0, vec2(0.45,0.22), 0.2, w+0.04);
#elif ENV==3 // rim / contour
    L += 3.*rectL(el,az, 0.2, 2.35, 0.75, 0.12, w);
    L += 3.*rectL(el,az, 0.2, -2.35, 0.75, 0.12, w);
    L += 1.4*rectL(el,az, 0.95, PI, 0.25, 0.7, w);
    L += 0.35*rectL(el,az, 0.4, -0.4, 0.3, 0.4, w);
#elif ENV==4 // sunset
    vec3 sky = mix(vec3(1.0,0.42,0.18)*1.3, vec3(0.18,0.32,0.95)*0.9, smoothstep(-0.05, 0.6, d.y));
    sky = mix(vec3(0.12,0.05,0.12), sky, smoothstep(-0.25, 0.0, d.y));
    base = mix(base, sky, 0.85);
    float sun = rectL(el, az, 0.14, -0.7, 0.07, 0.07, w+0.02);
    Lc += vec3(1.,0.75,0.45)*5.*sun;
#else // dark
    L += 2.5*rectL(el,az, 0.62, -0.6, 0.1, 0.12, w);
#endif
  return base + (vec3(L) + Lc)*att*uEnvInt;
}
vec3 backdrop(vec3 ro, vec3 rd, float rough){
  vec3 e = envMap(rd, rough);
  if(rd.z < -0.02){
    float t = (-BZ - ro.z)/rd.z;
    vec3 h = ro + rd*t;
    vec2 s = (h.xy - vec2(0., uPanY))/((CAMZ+BZ)*TH/uZoom);
    return mix(e, bgCol(s), smoothstep(0.0, 0.55, -rd.z));
  }
  return e;
}

// ---------------------------------------------------------------- materials
struct Mat { vec3 c; float rough; vec3 c2; float grad; float metal; float coat; float trans; float ior; float dens; float irid; float emit; float rim; vec3 pc; float ps; float pa; float ga; int pt; };
Mat getMat(int i){
  Mat m; vec4 a=uMA[i], b=uMB[i], c=uMC[i], d=uMD[i], e=uME[i], f=uMF[i];
  m.c=a.rgb; m.rough=a.a; m.c2=b.rgb; m.grad=b.a; m.metal=c.x; m.coat=c.y; m.trans=c.z; m.ior=c.w;
  m.dens=d.x; m.irid=d.y; m.emit=d.z; m.rim=d.w; m.pc=e.rgb; m.ps=e.a; m.pa=f.x; m.ga=f.y; m.pt=uPat[i];
  return m;
}
struct Surf { vec3 alb; float trans; vec3 emit; };

#if PAT
float patternF(int t, vec3 lp, float sc){
  vec3 q = lp*sc;
  if(t==1){ return smoothstep(-0.1, 0.1, sin(lp.y*sc*PI)); }
  if(t==2){ vec3 f = fract(q)-0.5; return 1.-smoothstep(0.19,0.23,length(f)); }
  if(t==3){ float n = fbm(lp*sc*0.5); float v = abs(sin((lp.x*0.8+lp.y)*sc*0.6 + n*7.)); return 1.-smoothstep(0.0,0.14,v); }
  if(t==4){ vec3 s = normalize(lp); float lat = asin(clamp(s.y,-1.,1.)); float lon = atan(s.z,s.x);
    float g1 = abs(fract(lat*sc/PI*2.)-0.5); float g2 = abs(fract(lon*sc/PI)-0.5);
    return smoothstep(0.42, 0.46, max(g1,g2)); }
  if(t==5){ vec3 c = floor(q); return mod(c.x+c.y+c.z, 2.); }
  if(t==6){ float n = fbm(lp*sc*0.4); return smoothstep(0.5,0.54,n); }
  if(t==7){ float a = atan(lp.z, lp.x); return smoothstep(-0.12,0.12, sin(a*3. + lp.y*sc*1.2)); }
  return 0.;
}
#endif

#if FACE>0
float faceMask(vec3 u, out float blush){
  blush = 0.;
  vec3 f = u/uHeadScale;
  if(f.z < 0.12) return 0.;
  float k = uFaceB.x; float ey = 0.08 + uFaceB.y; float ex = 0.3*uFaceB.w;
  vec2 p = f.xy;
  vec2 pe = vec2(abs(p.x) - ex, p.y - ey);
  vec2 pl = vec2(p.x + ex, p.y - ey);
  vec2 pr = vec2(p.x - ex, p.y - ey);
  float cy = ey - 0.2*k;
  float th = 0.021*k;
  float d = 1e5;
  const int t = FACE;
  float smile = sdArc(vec2(p.x, -(p.y - cy - 0.1*k)), 0.95, 0.13*k, th);
  if(t==1){ d = length(pe) - 0.075*k; }
  else if(t==2){ d = min(length(pe)-0.07*k, smile); }
  else if(t==3){ d = min(sdArc(vec2(pe.x, pe.y + 0.035*k), 1.1, 0.075*k, th), smile); }
  else if(t==4){ d = min(sdArc(vec2(pe.x, -(pe.y - 0.03*k)), 1.0, 0.07*k, th), sdBox2(vec2(p.x, p.y-cy+0.01), vec2(0.045*k, 0.0001), th)); }
  else if(t==5){ d = min(min(length(pl)-0.07*k, sdArc(vec2(pr.x, pr.y + 0.035*k), 1.1, 0.075*k, th)), smile); }
  else if(t==6){ d = min(length(pe)-0.085*k, abs(length(vec2(p.x, p.y-cy+0.02*k))-0.055*k)-th); }
  else if(t==7){ float s = 0.17*k; d = min(sdHeart(pe/s + vec2(0.,0.5))*s, smile); }
  else if(t==8){ d = min(length(pe)-0.07*k, sdArc(vec2(abs(p.x)-0.047*k, -(p.y - cy - 0.02*k)), 1.45, 0.047*k, th)); }
  float w = uPixel/uHeadR*1.3;
  float fm = 1.-smoothstep(-w, w, d);
  fm *= smoothstep(0.12, 0.3, f.z);
  vec2 cq = vec2(abs(p.x) - ex - 0.1, p.y - ey + 0.17*k);
  blush = exp(-dot(cq,cq)/(0.011*k*k))*uFaceB.z*smoothstep(0.12, 0.3, f.z);
  return fm;
}
#endif

Surf surface(Mat m, int id, vec3 p, vec3 n){
  Surf s;
  bool bodySpace = (id==1 || id==5);
  vec3 lp = bodySpace ? (p-uBodyPos)/uBodyR : uHeadRot*(p-uHeadPos)/uHeadR;
  float t = dot(n, vec3(cos(m.ga), sin(m.ga), 0.))*0.5+0.5;
  vec3 col = mix(m.c, mix(m.c2, m.c, smoothstep(0.,1.,t)), m.grad);
  float tr = m.trans;
  vec3 em = col*m.emit*1.6;
#if PAT
  if(m.pt>0 && m.pa>0.){
    float pm = patternF(m.pt, lp, m.ps)*m.pa;
    col = mix(col, m.pc, pm); tr *= 1.-pm*0.8; em = mix(em, m.pc*m.emit*1.6, pm);
  }
#endif
#if FACE>0
  if(id==0){
    float bl; float fm = faceMask(lp, bl);
    col = mix(col, uBlushCol, clamp(bl,0.,1.)*0.7);
    tr *= 1.-clamp(bl,0.,1.)*0.5;
    col = mix(col, uFaceA.rgb, fm); tr *= 1.-fm;
    em = mix(em, uFaceA.rgb*uFaceA.w*3., fm);
  }
#endif
  s.alb = col; s.trans = tr; s.emit = em;
  return s;
}

float D_GGX(float nh, float a){ float a2=a*a; float d=nh*nh*(a2-1.)+1.; return a2/(PI*d*d); }

vec3 irrInside(vec3 n){
  return uKeyCol*(0.35+0.35*dot(n,uKeyDir)) + envMap(n,1.)*0.4*uAmb + vec3(uAmb*0.12);
}

vec3 shadeCore(Mat m, Surf s, vec3 p, vec3 n, vec3 rd, vec4 sceneR, vec3 transCol, float sh, float ao){
  float rough = clamp(m.rough, 0.02, 1.);
  vec3 V = -rd; float nv = clamp(dot(n,V), 0., 1.);
  vec3 L = uKeyDir; vec3 H = normalize(L+V);
  float nl = dot(n,L); float nh = max(dot(n,H),0.);
  float wrap = 0.2;
  float diff = clamp((nl+wrap)/(1.+wrap), 0., 1.);
  vec3 irr = uKeyCol*diff*sh + (envMap(n,1.)*0.3 + envBase(n)*0.6)*uAmb*ao;
  vec3 col = s.alb;
  vec3 iri = 0.5+0.5*cos(TAU*(vec3(0.,0.33,0.67) + 1.8*(1.-nv) + dot(n, vec3(0.3,0.5,0.))));
  vec3 f0 = mix(vec3(0.04), col, m.metal);
  f0 = mix(f0, iri*mix(0.35,1.,m.metal), m.irid*0.85);
  float fr = pow(1.-nv, 5.);
  vec3 F = f0 + (max(vec3(1.-rough), f0) - f0)*fr;
  vec3 R = reflect(rd, n);
  vec3 envR = envMap(R, rough);
  envR = mix(envR, sceneR.rgb, sceneR.a*(1.-smoothstep(0.05, 0.45, rough)));
  vec3 envC = mix(envMap(R, 0.03), sceneR.rgb, sceneR.a);
  vec3 specL = uKeyCol*min(D_GGX(nh, rough*rough), 60.)*0.25*max(nl,0.)*sh;
  vec3 spec = (envR*mix(1.,0.35,rough) + specL)*F;
  vec3 diffuse = col*irr*(1.-m.metal);
  vec3 base = mix(diffuse, transCol, s.trans);
  float Fm = max(F.r, max(F.g, F.b));
  vec3 c = base*(1.-Fm*(1.-m.metal)) + spec;
  float Fc = 0.04 + 0.96*fr;
  vec3 coat = (envC + uKeyCol*min(D_GGX(nh, 0.0025),200.)*0.25*max(nl,0.)*sh)*Fc;
  c = c*(1.-Fc*m.coat) + coat*m.coat;
  float rimF = pow(1.-nv, 3.);
  vec3 Lh = normalize(vec3(L.x, 0.2, L.z) + vec3(0.,0.,0.001));
  c += uRimCol*rimF*(0.35+0.65*max(dot(n,-Lh),0.));
  c += col*m.rim*pow(1.-nv, 2.2)*1.6;
  c += s.emit;
  return c;
}

vec3 shadeSec(vec3 p, vec3 rd, vec3 n, int id){
  Mat m = getMat(id); Surf s = surface(m, id, p, n);
  vec3 tc = vec3(0.);
#if GLASS
  if(s.trans > 0.01){
    vec3 rd1 = refract(rd, n, 1./m.ior);
    if(dot(rd1,rd1)<1e-4) rd1 = rd;
    vec3 behind = backdrop(p, rd1, m.rough);
    float trv = uHeadR*1.5*max(dot(n,-rd),0.2);
    vec3 absorb = pow(max(s.alb,vec3(0.001)), vec3(trv*m.dens*2.2));
    tc = behind*absorb + s.alb*irrInside(n)*m.dens*0.5;
  }
#endif
  return shadeCore(m, s, p, n, rd, vec4(0.), tc, 1., 1.);
}

float maxc(vec3 v){ return max(v.x, max(v.y, v.z)); }
vec2 sphRange(vec3 ro, vec3 rd, vec3 c, float r){
  vec3 oc = ro - c; float b = dot(oc, rd); float h = b*b - dot(oc,oc) + r*r;
  if(h < 0.) return vec2(1e5, -1e5);
  h = sqrt(h); return vec2(-b-h, -b+h);
}
vec2 sceneRange(vec3 ro, vec3 rd){
#if HEADACC
  float rh = uHeadR*2.45;
#else
  float rh = uHeadR*maxc(uHeadScale)*1.03;
#endif
#if NECK>0
  float rb = uBodyR*maxc(uBodyScale)*1.5;
#else
  float rb = uBodyR*maxc(uBodyScale)*1.03;
#endif
  vec2 a = sphRange(ro, rd, uHeadPos, rh);
  vec2 b = sphRange(ro, rd, uBodyPos, rb);
  if(a.y < 0.) a = vec2(1e5, -1e5);
  if(b.y < 0.) b = vec2(1e5, -1e5);
  return vec2(max(min(a.x, b.x), 0.), max(a.y, b.y));
}

vec4 traceSec(vec3 ro, vec3 rd){
  vec2 rg = sceneRange(ro, rd);
  if(rg.y <= rg.x) return vec4(0.);
  float t = rg.x; float id = -1.;
  for(int i=uZero;i<56;i++){
    vec2 h = map(ro+rd*t);
    if(h.x < 0.0015){ id = h.y; break; }
    t += h.x*0.95;
    if(t > rg.y) break;
  }
  if(id < 0.) return vec4(0.);
  vec3 p = ro+rd*t; vec3 n = calcN(p);
  return vec4(shadeSec(p, rd, n, int(id+0.5)), 1.);
}

float softShadow(vec3 ro, vec3 rd){
  vec2 rg = sceneRange(ro, rd);
  if(rg.y <= 0.02) return 1.;
  float res = 1., t = max(0.015, rg.x), ph = 1e10, tmax = min(rg.y, 4.);
  gSh = true;
  for(int i=uZero;i<48;i++){
    vec2 h = map(ro+rd*t);
    float tr = uMC[int(h.y+0.5)].z;
    float y = h.x*h.x/(2.0*ph);
    float dd = sqrt(max(h.x*h.x-y*y, 0.));
    res = min(res, mix(6.*dd/max(0.0001,t-y), 1., tr*0.6));
    ph = h.x;
    t += clamp(min(h.x, gB), 0.006, 0.13);
    if(res < 0.002 || t > tmax) break;
  }
  gSh = false;
  res = clamp(res, 0., 1.);
  return res*res*(3.-2.*res);
}

float calcAO(vec3 p, vec3 n){
  float o = 0., s = 1.;
  gSh = true;
  for(int i=uZero;i<5;i++){ float h = 0.02 + 0.13*float(i)/4.; float d = map(p+n*h).x; o += (h-d)*s; s *= 0.85; }
  gSh = false;
  return clamp(1.-2.2*o, 0., 1.);
}

vec3 shadeFull(vec3 p, vec3 rd, vec3 n, int id){
  Mat m = getMat(id); Surf s = surface(m, id, p, n);
  float sh = uShadow > 0.001 ? mix(1., softShadow(p+n*(id>1 ? 0.03 : 0.01), uKeyDir), uShadow) : 1.;
  float ao = calcAO(p, n);
  vec3 R = reflect(rd, n);
  vec4 sr = vec4(0.);
  if(m.rough < 0.45 || m.coat > 0.05) sr = traceSec(p + n*0.015, R);
  vec3 tc = vec3(0.);
#if GLASS
  if(s.trans > 0.01){
    vec3 rd1 = refract(rd, n, 1./m.ior);
    if(dot(rd1,rd1)<1e-4) rd1 = reflect(rd, n);
    vec3 pe, ne; float t;
    if(id <= 1){
      vec3 c = id==0 ? uHeadPos : uBodyPos;
      vec3 r = id==0 ? uHeadR*uHeadScale : uBodyR*uBodyScale;
      mat3 Rm = id==0 ? uHeadRot : mat3(1.);
      vec3 o = Rm*(p - c), dl = Rm*rd1;
      vec3 oc = o/r, dc = dl/r;
      float qa = dot(dc,dc), qb = dot(oc,dc), qc = dot(oc,oc) - 1.;
      t = max((-qb + sqrt(max(qb*qb - qa*qc, 0.)))/qa, 0.);
      ne = normalize(transpose(Rm)*((o + dl*t)/(r*r)));
      pe = p + rd1*t;
    } else {
      vec3 q = p - n*0.003; t = 0.012;
      for(int i=uZero;i<24;i++){ float d = map(q+rd1*t).x; if(d > -0.0008) break; t += max(-d, 0.004); if(t > 1.2) break; }
      pe = q + rd1*t; ne = calcN(pe);
    }
    vec3 rd2 = refract(rd1, -ne, m.ior);
    if(dot(rd2,rd2)<1e-4) rd2 = reflect(rd1, -ne);
    vec4 b = traceSec(pe + rd2*0.015, rd2);
    vec3 behind = mix(backdrop(pe, rd2, m.rough), b.rgb, b.a);
    vec3 absorb = pow(max(s.alb, vec3(0.001)), vec3(t*m.dens*2.2));
    float nv = clamp(dot(n,-rd),0.,1.);
    vec3 scat = s.alb*irrInside(n)*min(m.dens,1.)*0.32*(0.45 + 0.9*(1.-nv));
    float cau = pow(clamp(dot(n,-uKeyDir)*0.6+0.45, 0., 1.), 4.);
    scat += mix(vec3(1.), s.alb, 0.75)*uKeyCol*cau*0.55*(1.-0.5*nv);
    tc = behind*absorb + scat;
  }
#endif
  return shadeCore(m, s, p, n, rd, sr, tc, sh, ao);
}

vec3 softClip(vec3 c){
  const float k = 0.72;
  vec3 hi = k + (1.-k)*(1.-exp(-(c-k)/(1.-k)));
  return mix(c, hi, step(vec3(k), c));
}

float sparkles(vec2 s){
  float acc = 0.;
  for(int k=0;k<2;k++){
    float sc = 3.6 + float(k)*2.8;
    vec2 g = s*sc + float(k)*7.3; vec2 id = floor(g); vec2 f = fract(g)-0.5;
    float h = hash12(id + float(k)*13.1);
    if(h > 0.62){
      vec2 o = (vec2(hash12(id+1.7), hash12(id+4.1))-0.5)*0.55;
      vec2 d = f - o;
      float tw = 0.55+0.45*sin(uTime*2.2 + h*40.);
      float sz = (0.14 + 0.2*hash12(id+9.))*tw;
      float th = sz*0.07;
      float a = (1.-smoothstep(0., sz, abs(d.x)))*(1.-smoothstep(0., th, abs(d.y)));
      float b = (1.-smoothstep(0., th, abs(d.x)))*(1.-smoothstep(0., sz, abs(d.y)));
      float core = 1.-smoothstep(0., sz*0.28, length(d));
      acc += (max(a,b) + core*0.8)*tw;
    }
  }
  return acc;
}

void main(){
  vec2 fc = gl_FragCoord.xy + uOffset;
  vec2 sc = (2.*fc - uRes)/uRes.y;
  vec3 ro = vec3(0., uPanY, CAMZ);
  vec3 rd = normalize(vec3(sc*TH/uZoom, -1.));
  vec2 rg = sceneRange(ro, rd);
  float t = rg.x; float id = -1.;
  if(rg.y > rg.x){
    for(int i=uZero;i<110;i++){
      vec2 h = map(ro+rd*t);
      if(h.x < 0.00035*t){ id = h.y; break; }
      t += h.x*0.9;
      if(t > rg.y) break;
    }
  }
  vec3 col; float alpha = 1.;
  if(id >= 0.){
    vec3 p = ro+rd*t; vec3 n = calcN(p);
    col = softClip(shadeFull(p, rd, n, int(id+0.5))*uExposure);
  } else {
    col = bgCol(sc);
    alpha = 1.-uAlphaBg;
  }
  vec3 fxc = uMA[6].rgb;
  if((FX&4)!=0 && id < 0.){
    vec3 hc = uHeadPos - ro; float dh = length(cross(rd, hc)) - uHeadR*max(uHeadScale.x,uHeadScale.y);
    vec3 bc = uBodyPos - ro; float db = length(cross(rd, bc)) - uBodyR*max(uBodyScale.x, uBodyScale.y);
    float g = (exp(-max(dh,0.)*4.0)*0.8 + exp(-max(db,0.)*4.0)*0.55)*uPopFx;
    col += fxc*g*0.9; alpha = max(alpha, clamp(g,0.,1.)*0.9);
  }
  if((FX&8)!=0){
    float sp = sparkles(sc)*uPopFx*(id<0. ? 1. : 0.35);
    col += mix(fxc, vec3(1.), 0.55)*sp; alpha = max(alpha, clamp(sp,0.,1.));
  }
  col = pow(max(col, 0.), vec3(1./2.2));
  float gr = hash12(fc + fract(uTime*7.)*100.) - 0.5;
  col += gr*(uGrain*0.07 + 1.5/255.);
  col = clamp(col, 0., 1.);
  outColor = vec4(col*alpha, alpha);
}

  const r = Math.hypot(x, y); if (r > 0.97){ x *= 0.97 / r; y *= 0.97 / r; }

}

function dragOn(elm, onMove, onEnd){

    elm.addEventListener('pointermove', mv); elm.addEventListener('pointerup', up); elm.addEventListener('pointercancel', up);
  });
}

const hist = { stack: [], idx: -1 };
let commitTimer = null;
function commitNow(){
  clearTimeout(commitTimer); commitTimer = null;
  const js = JSON.stringify(state);
  if (hist.stack[hist.idx] === js) return;
  hist.stack = hist.stack.slice(0, hist.idx + 1);
  hist.stack.push(js);
  if (hist.stack.length > 120) hist.stack.shift();
  hist.idx = hist.stack.length - 1;
  store.set('sfera.state', state);
  updateHistBtns();
}
function scheduleCommit(){ clearTimeout(commitTimer); commitTimer = setTimeout(commitNow, 350); }
function applyState(){ computeTargets(state, T, discT); updateAmbient(); syncAll(true); store.set('sfera.state', state); }
function undo(){ if (commitTimer) commitNow(); if (hist.idx > 0){ hist.idx--; state = JSON.parse(hist.stack[hist.idx]); activePreset = null; applyState(); updateHistBtns(); } }
function redo(){ if (hist.idx < hist.stack.length - 1){ hist.idx++; state = JSON.parse(hist.stack[hist.idx]); activePreset = null; applyState(); updateHistBtns(); } }
const undoBtn = $('#undoBtn'), redoBtn = $('#redoBtn');
function updateHistBtns(){ undoBtn.disabled = hist.idx <= 0; redoBtn.disabled = hist.idx >= hist.stack.length - 1; }

// ============================================================ toast
let toastTimer;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200); }

// ============================================================ export & share
let exporting = false;
async function exportPNG(){
  if (exporting || !gl || glLost) return;
  exporting = true;
  const size = EX().size;
  const maxTex = gl.getParameter(gl.MAX_TEXTURE_SIZE);
  const ss = size >= 2048 ? 1.5 : 2;
  const W = Math.min(Math.round(size * ss), 8192, maxTex * 8);
  const bar = progress.querySelector('i'); progress.style.display = 'block'; bar.style.width = '0%';
  exportBtn.disabled = true; $('#downloadBtn').disabled = true;
  try {
    const px = await renderPixels(state, W, W, { alphaBg: EX().transparent, onProgress: p => { bar.style.width = Math.round(p * 100) + '%'; } });
    const big = pixelsToCanvas(px, W, W);
    const out = document.createElement('canvas'); out.width = size; out.height = size;
    const ctx = out.getContext('2d');
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(big, 0, 0, size, size);
    if (EX().shape !== 'square'){
      ctx.globalCompositeOperation = 'destination-in';
      ctx.beginPath();
      if (EX().shape === 'circle') ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
      else if (ctx.roundRect) ctx.roundRect(0, 0, size, size, size * 0.22);
      else ctx.rect(0, 0, size, size);
      ctx.fill();
    }
    const blob = await new Promise(r => out.toBlob(r, 'image/png'));
    const a = el('a', { href: URL.createObjectURL(blob), download: `sfera-avatar-${size}.png` });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast(`PNG ${size}×${size} сохранён`);
  } catch (e){ console.error(e); toast('Не удалось сохранить PNG'); }
  exporting = false; exportBtn.disabled = false; $('#downloadBtn').disabled = false;
  setTimeout(() => { progress.style.display = 'none'; }, 600);
}
const b64e = str => btoa(String.fromCharCode(...new TextEncoder().encode(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const b64d = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0)));
async function copyLink(){
  const url = location.href.split('#')[0] + '#a=' + b64e(JSON.stringify(state));
  try { history.replaceState(null, '', url); } catch(e){}
  try { await navigator.clipboard.writeText(url); toast('Ссылка скопирована'); }
  catch(e){ const ta = el('textarea', {}, url); document.body.append(ta); ta.select(); try { document.execCommand('copy'); toast('Ссылка скопирована'); } catch(_){ toast('Скопируйте ссылку из адресной строки'); } ta.remove(); }
}
function saveJSON(){
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = el('a', { href: URL.createObjectURL(blob), download: 'sfera-avatar.json' });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function loadInto(obj){ state = merge(clone(BASE), obj); activePreset = null; changed(); syncAll(true); }
btnLink.addEventListener('click', copyLink);
btnJson.addEventListener('click', saveJSON);
btnImport.addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try { loadInto(JSON.parse(await f.text())); toast('Настройки загружены'); } catch(err){ toast('Файл не похож на настройки аватара'); }
  e.target.value = '';
});
btnReset.addEventListener('click', () => { state = presetState(PRESETS[0]); activePreset = PRESETS[0].id; changed({ keepPreset: true }); syncAll(true); toast('Начали заново'); });

// ============================================================ random
function randomize(){
  const s = clone(BASE);
  const hue = rnd(0, 360);
  const fin = pick(['matte','satin','gloss','gloss','glass','glass','metal','chrome','holo','neon']);
  s.head = mat(hsl(hue, rnd(.45, .9), rnd(.35, .62)), fin);
  if (Math.random() < .4){ s.head.color2 = hsl(hue + rnd(-70, 70), rnd(.5, .9), rnd(.15, .4)); s.head.grad = rnd(.35, .85); s.head.gradAngle = Math.round(rnd(0, 360)); }
  if (Math.random() < .25){ s.head.pattern = 1 + Math.floor(rnd(0, 7)); s.head.patColor = hsl(hue + 180, rnd(.4, .8), rnd(.6, .85)); s.head.patScale = rnd(3, 8); }
  s.link = Math.random() < .7;
  if (!s.link) s.body = mat(hsl(hue + rnd(30, 180), rnd(.4, .85), rnd(.3, .6)), pick(['matte','satin','gloss','glass','metal']));
  const dark = Math.random() < .6;
  s.scene.bgType = pick([0, 1, 2, 2, 3]);
  s.scene.bg1 = dark ? hsl(hue + rnd(-40, 40), rnd(.15, .5), rnd(.04, .14)) : hsl(hue + rnd(-40, 40), rnd(.2, .5), rnd(.8, .92));
  s.scene.bg2 = dark ? hsl(hue + rnd(-60, 60), rnd(.15, .5), rnd(.02, .1)) : hsl(hue + rnd(-60, 60), rnd(.2, .5), rnd(.68, .84));
  s.scene.bgAngle = Math.round(rnd(0, 360));
  s.scene.env = pick([0, 0, 1, 2, 3, 4]);
  s.scene.lightAz = Math.round(rnd(-60, 60)); s.scene.lightEl = Math.round(rnd(20, 60));
  s.scene.amb = dark ? .45 : .65;
  if (Math.random() < .55){
    s.face.type = 1 + Math.floor(rnd(0, 8));
    s.face.color = luma(s.head.color) > .3 ? '#141418' : '#ffffff';
    if (fin === 'neon'){ s.face.color = '#ffffff'; s.face.glow = 1; }
    if (Math.random() < .35) s.face.blush = rnd(.3, .7);
  }
  const ac = () => ({ color: hsl(hue + pick([0, 30, 150, 180, 210]), rnd(.4, .85), rnd(.45, .75)), finish: pick(['metal','gloss','chrome','matte','neon','glass']) });
  if (Math.random() < .45){ s.acc.hat = 1 + Math.floor(rnd(0, 8)); s.accMat.hat = ac(); }
  if (Math.random() < .3){ s.acc.eye = 1 + Math.floor(rnd(0, 5)); s.accMat.eye = ac(); }
  if (Math.random() < .25){ s.acc.ear = 1 + Math.floor(rnd(0, 4)); s.accMat.ear = ac(); }
  if (Math.random() < .3){ s.acc.neck = 1 + Math.floor(rnd(0, 5)); s.accMat.neck = ac(); }
  s.acc.fx = (Math.random() < .2 ? 1 : 0) | (Math.random() < .2 ? 2 : 0) | (Math.random() < .2 ? 4 : 0) | (Math.random() < .2 ? 8 : 0);
  s.accMat.fx = { color: hsl(hue + 180, .8, .65), finish: 'neon' };
  s.accMat.accent = ac();
  s.shape.headSize = rnd(.55, .67); s.shape.headW = rnd(.92, 1.08); s.shape.bodyW = rnd(.95, 1.12); s.shape.gap = rnd(.16, .28);
  s.shape.tilt = Math.random() < .3 ? Math.round(rnd(-10, 10)) : 0;
  state = s; activePreset = null; changed(); syncAll(true);
}

// ============================================================ ambient & theme
function updateAmbient(){
  const r = document.documentElement.style;
  r.setProperty('--c1', state.head.color);
  r.setProperty('--c2', state.scene.bgType ? state.scene.bg2 : (state.link ? state.head.color2 : state.body.color));
  r.setProperty('--c3', state.acc.hat || state.acc.fx ? (state.acc.fx ? state.accMat.fx.color : state.accMat.hat.color) : state.scene.bg1);
  wrap.style.background = state.scene.bg1;
}
let theme = store.get('sfera.theme', null) || (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
function applyTheme(){
  document.documentElement.dataset.theme = theme;
  const b = $('#themeBtn'); b.innerHTML = icon(theme === 'dark' ? 'sun' : 'moon');
  b.setAttribute('aria-label', theme === 'dark' ? 'Светлая тема' : 'Тёмная тема'); b.title = b.getAttribute('aria-label');
}
$('#themeBtn').addEventListener('click', () => { theme = theme === 'dark' ? 'light' : 'dark'; store.set('sfera.theme', theme); applyTheme(); });

// ============================================================ stage interactions
$$('[data-icon]').forEach(s => { s.outerHTML = icon(s.dataset.icon); });
const animBtn = $('#animBtn');
function paintAnim(){ animBtn.innerHTML = icon(anim ? 'pause' : 'play'); animBtn.setAttribute('aria-pressed', String(anim)); animBtn.setAttribute('aria-label', anim ? 'Остановить анимацию' : 'Включить анимацию'); animBtn.title = animBtn.getAttribute('aria-label'); }
animBtn.addEventListener('click', () => { anim = !anim; store.set('sfera.anim2', anim); paintAnim(); dirty = true; });
const roundBtn = $('#roundBtn');
roundBtn.addEventListener('click', () => { const on = !wrap.classList.contains('round'); wrap.classList.toggle('round', on); roundBtn.setAttribute('aria-pressed', String(on)); });
$('#resetViewBtn').addEventListener('click', () => {
  const base = activePreset ? presetState(PRESETS.find(p => p.id === activePreset)) : BASE;
  Object.assign(state.shape, { zoom: 1, panY: 0, yaw: 0, pitch: 0, tilt: 0 });
  state.scene.lightAz = base.scene.lightAz; state.scene.lightEl = base.scene.lightEl;
  changed({ keepPreset: true });
});
undoBtn.addEventListener('click', undo); redoBtn.addEventListener('click', redo);
$('#randomBtn').addEventListener('click', randomize);
$('#downloadBtn').addEventListener('click', () => exportPNG());
dragOn(wrap, e => {
  wrap.classList.add('dragging');
  const r = wrap.getBoundingClientRect();
  lightFromXY(((e.clientX - r.left) / r.width * 2 - 1) * 1.1, -((e.clientY - r.top) / r.height * 2 - 1) * 1.1);
}, () => { wrap.classList.remove('dragging'); });
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  state.shape.zoom = clamp(state.shape.zoom * Math.exp(-e.deltaY * 0.0012), 0.7, 1.6);
  changed({ keepPreset: true });
}, { passive: false });
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (!mod) return;
  const k = e.key.toLowerCase();
  if (k === 'z' && !e.shiftKey){ e.preventDefault(); undo(); }
  else if ((k === 'z' && e.shiftKey) || k === 'y'){ e.preventDefault(); redo(); }
});
new ResizeObserver(() => { dirty = true; }).observe(wrap);

// ============================================================ init
function initialState(){
  const m = location.hash.match(/#a=([\w-]+)/);
  if (m){ try { return merge(clone(BASE), JSON.parse(b64d(m[1]))); } catch(e){} }
  const saved = store.get('sfera.state', null);
  if (saved && saved.v === 1) return merge(clone(BASE), saved);
  activePreset = PRESETS[0].id;
  return presetState(PRESETS[0]);
}
applyTheme(); paintAnim();
state = initialState();
computeTargets(state, T, discT);
C.set(T);
discR.acc = discT.acc.slice(); discR.fx = discT.fx;
updateAmbient();
selectTab(store.get('sfera.tab', 'presets'));
syncAll(true);
commitNow();
if (initGL()){
  requestAnimationFrame(frame);
  PRESETS.forEach((p, i) => {
    const th = presetBtns[i]._th;
    if (PRESET_THUMBS[p.id]){ th.style.backgroundImage = `url(${PRESET_THUMBS[p.id]})`; th.classList.remove('loading'); return; }
    thumbQueue.push(async () => {
      try { const url = await thumbnail(presetState(p), 168); th.style.backgroundImage = `url(${url})`; th.classList.remove('loading'); } catch(e){ console.error(e); }
    });
  });
}
window.__BASE = BASE;
window.__presetState = presetState;
window.__sfera = { get state(){ return state; }, set state(v){ state = v; applyState(); }, presets: PRESETS, selectTab, exportPNG, renderPixels, pixelsToCanvas, thumbsLeft: () => thumbQueue.length, perf: () => ({ refined, cpp, firstFrame, progs: programs.size, size: canvas.width, loader: !$('#loader').hidden }), setAnim(v){ anim = v; paintAnim(); dirty = true; }, applyState, changed,
  // deterministic stepping for offline capture (demo video)
  video: {
    advance(dt){
      const k = 1 - Math.exp(-dt * 11); let maxd = 0;
      for (let i = 0; i < TOTAL; i++){ const d = T[i] - C[i]; if (Math.abs(d) > 1e-5){ C[i] += d * k; maxd = Math.max(maxd, Math.abs(d)); } else C[i] = T[i]; }
      const popping = stepPops(dt);
      discR.face = discT.face; discR.env = discT.env; discR.bgType = discT.bgType; discR.pat.set(discT.pat);
      const settled = maxd < 0.002 && pop.v.every(v => Math.abs(1 - v) < 0.004) && pop.vel.every(v => Math.abs(v) < 0.03) && Math.abs(1 - pop.fx) < 0.004 && discT.acc.every((v, i) => v === discR.acc[i]);
      return { maxd, popping, settled };
    },
    async render(size){
      const px = await renderArrays(C, discR, pop.v.slice(), pop.fx, size, size, { yieldEvery: false, extra: T });
      return pixelsToCanvas(px, size, size).toDataURL('image/png');
    }
  } };
})();
</script>
